<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LeetCode to GitHub</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 18px;
        font-family: Arial, sans-serif;
        color: #111827;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 18px;
      }

      .github-button {
        display: flex;
        width: 100%;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 0;
        border-radius: 8px;
        color: #ffffff;
        background: #000000;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 16px rgba(15, 23, 42, 0.16);
      }

      .github-button:hover {
        background: #171717;
      }

      .github-button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .github-mark {
        width: 22px;
        height: 22px;
        fill: currentColor;
        flex: 0 0 auto;
      }

      .section {
        margin-top: 16px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 700;
      }

      select {
        box-sizing: border-box;
        width: 100%;
        padding: 9px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #ffffff;
        font-size: 13px;
      }

      .secondary {
        width: 100%;
        margin-top: 10px;
        padding: 9px 10px;
        border: 0;
        border-radius: 6px;
        color: #1f2937;
        background: #e5e7eb;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .secondary:hover {
        background: #d1d5db;
      }

      .danger {
        width: 100%;
        margin-top: 10px;
        padding: 9px 10px;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        background: #b91c1c;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .danger:hover {
        background: #991b1b;
      }

      .device-code {
        margin-top: 12px;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #f8fafc;
        font-family: Consolas, monospace;
        font-size: 20px;
        font-weight: 700;
        text-align: center;
        letter-spacing: 1px;
      }

      .hint {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.4;
        color: #64748b;
      }

      #status {
        min-height: 18px;
        margin-top: 12px;
        font-size: 13px;
        line-height: 1.4;
      }

      .success {
        color: #047857;
      }

      .error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1>LeetCode to GitHub</h1>

    <button id="startLogin" class="github-button" type="button">
      <svg class="github-mark" viewBox="0 0 98 96" aria-hidden="true">
        <path d="M48.9 0C21.9 0 0 21.9 0 48.9c0 21.6 14 39.9 33.4 46.4 2.4.4 3.3-1.1 3.3-2.4v-8.5c-13.6 3-16.5-6.6-16.5-6.6-2.2-5.7-5.4-7.2-5.4-7.2-4.4-3 .3-3 .3-3 4.9.3 7.5 5 7.5 5 4.3 7.4 11.4 5.3 14.2 4 .4-3.1 1.7-5.3 3.1-6.5-10.9-1.2-22.3-5.4-22.3-24.2 0-5.3 1.9-9.7 5-13.1-.5-1.2-2.2-6.2.5-12.9 0 0 4.1-1.3 13.4 5 3.9-1.1 8-1.6 12.1-1.6s8.3.5 12.1 1.6c9.3-6.3 13.4-5 13.4-5 2.7 6.7 1 11.7.5 12.9 3.1 3.4 5 7.8 5 13.1 0 18.8-11.5 23-22.4 24.2 1.8 1.5 3.3 4.5 3.3 9.1v13.5c0 1.3.9 2.8 3.4 2.4C84 88.8 98 70.5 98 48.9 97.8 21.9 75.9 0 48.9 0z"/>
      </svg>
      <span>Sign in with GitHub</span>
    </button>

    <div id="deviceCode" class="device-code" hidden></div>
    <div id="deviceHint" class="hint" hidden>Enter this code on GitHub if prompted. The extension will finish sign-in automatically.</div>

    <div id="repoSection" class="section" hidden>
      <label for="repoSelect">Send submissions to</label>
      <select id="repoSelect">
        <option value="">Choose a repository</option>
      </select>
      <button id="refreshRepos" class="secondary" type="button">Refresh repositories</button>
      <button id="logout" class="danger" type="button">Log out</button>
    </div>

    <div id="status" role="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
