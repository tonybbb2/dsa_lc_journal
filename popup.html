<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LeetCode to GitHub</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: Arial, sans-serif;
        color: #1f2937;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      label {
        display: block;
        margin-top: 10px;
        font-size: 13px;
        font-weight: 700;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 13px;
      }

      button {
        width: 100%;
        margin-top: 14px;
        padding: 9px 10px;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        background: #2563eb;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      #status {
        min-height: 18px;
        margin-top: 10px;
        font-size: 13px;
      }

      .success {
        color: #047857;
      }

      .error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1>LeetCode to GitHub</h1>

    <label for="token">GitHub personal access token</label>
    <input id="token" type="password" autocomplete="off" placeholder="github_pat_...">

    <label for="username">GitHub username</label>
    <input id="username" type="text" autocomplete="username" placeholder="octocat">

    <label for="repo">Repository name</label>
    <input id="repo" type="text" placeholder="dsa_lc_journal">

    <label for="branch">Branch name</label>
    <input id="branch" type="text" placeholder="main">

    <button id="save" type="button">Save settings</button>
    <div id="status" role="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
